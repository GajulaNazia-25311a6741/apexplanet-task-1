<!DOCTYPE html>
<html>
<head>
    <title>Responsive Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #076c60;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #302929;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px 25px;
        }

        nav a:hover {
            background-color: #5d948f;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            flex: 1;
            background-color: #e0f2f1;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
        }

        h1 {
            font-size: 40px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            h1 {
                font-size: 30px;
            }

            .container {
                flex-direction: column;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            header {
                padding: 15px;
            }

            h1 {
                font-size: 24px;
            }

            nav {
                flex-direction: column;
                text-align: center;
            }

            nav a {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Responsive Website</h1>
        <p>Works on Mobile, Tablet and Desktop</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>HTML is used to create the structure of a webpage.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>CSS is used to style and design webpages.</p>
        </div>

        <div class="box">
            <h2>JavaScript</h2>
            <p>JavaScript is used to make webpages interactive.</p>
        </div>

    </div>

</body>
</html>
